<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with Alvin about collaborations, projects, or web development questions.">
    <meta property="og:title" content="Contact | Alvin">
    <meta property="og:description" content="Get in touch with Alvin about collaborations, projects, or web development questions.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nobless017.github.io/Nobless017/contact.html">
    <meta property="og:image" content="https://nobless017.github.io/Nobless017/img/project-portfolio.jpg">
    <meta property="og:image:width" content="960">
    <meta property="og:image:height" content="540">
    <meta property="og:image:alt" content="Homepage of Alvin's portfolio">
    <meta property="og:locale" content="en_US">
    <meta name="twitter:card" content="summary_large_image">
    <title>Contact | Alvin</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script>
        (function () {
            var theme;
            try { theme = localStorage.getItem("theme"); } catch (error) {}
            if (theme !== "light" && theme !== "dark") {
                theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>
</head>
<body>
    <main class="page-shell">
        <nav class="navbar" aria-label="Main navigation">
            <a class="brand" href="index.html">Alvin<span>.</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a class="active" href="contact.html">Contact</a>
            </div>
            <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Toggle theme">🌙</button>
        </nav>

        <article class="content-card">
            <p class="eyebrow">GET IN TOUCH</p>
            <h1>Contact</h1>
            <p>Have a project, a question, or just want to say hi? Send me a message below.</p>
            <form class="contact-form" action="https://formspree.io/f/mppddnry" method="POST">
                <input type="hidden" name="_subject" value="New message from your portfolio website">
                <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" autocomplete="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Write your message" required></textarea>

                <button class="button-link primary" type="submit">Send Message</button>
                <p class="form-status" role="status" aria-live="polite"></p>
            </form>
            <div class="direct-contact">
                <span>I usually reply within 1–2 days. Prefer to chat?</span>
                <a href="https://wa.me/6282341735852" target="_blank" rel="noopener noreferrer">💬 Message me on WhatsApp</a>
            </div>
            <div class="button-row">
                <a class="button-link" href="index.html">Back to Home</a>
            </div>
        </article>
    </main>
    <footer class="footer">
        <p>© 2026 Alvin. Built with HTML, CSS, and JavaScript.</p>
        <div class="social-links" aria-label="Social links">
            <a href="https://github.com/Nobless017" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://wa.me/6282341735852" target="_blank" rel="noopener noreferrer">WhatsApp</a>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
